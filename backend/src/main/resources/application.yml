spring:
  application:
    name: centerport-backend

  datasource:
    url: ${DB_URL:DB_URL_NOT_CONFIGURED}
    username: ${DB_USERNAME:DB_USERNAME_CONFIGURED}
    password: ${DB_PASSWORD:DB_PASSWORD_CONFIGURED}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf
  storage:
    # Storage backend selector: "local" (filesystem) or "s3" (SeaweedFS / S3-compatible)
    type: ${STORAGE_TYPE:STORAGE_TYPE_NOT_SET}
    s3:
      endpoint: ${S3_ENDPOINT:S3_ENDPOINT_NOT_SET}
      region: ${S3_REGION:S3_REGION_NOT_SET}
      bucket: ${S3_BUCKET:S3_BUCKET_NOT_SET}
      access-key: ${S3_ACCESS_KEY:S3_ACCESS_KEY_NOT_SET}
      secret-key: ${S3_SECRET_KEY:S3_SECRET_KEY_NOT_SET}
      # Force path-style access (required by SeaweedFS / MinIO)
      path-style-access: ${S3_PATH_STYLE_ACCESS:S3_PATH_STYLE_ACCESS_NOT_SET}
